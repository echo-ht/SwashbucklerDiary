name: macos-probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15 }
          - { runner: macos-latest }
          - { runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Show runner
        run: uname -a
